<script>
document.addEventListener("DOMContentLoaded", () => {
"use strict";

const titleScreen = document.getElementById("title-screen");
const gameScreen = document.getElementById("game-screen");
const text = document.getElementById("dialogue-text");
const speaker = document.getElementById("speaker");
const choices = document.getElementById("choices");
const nextButton = document.getElementById("next-button");
const restartButton = document.getElementById("restart-button");

const story = {
  opening: { speaker: "ラヴィア", text: "あ、まだ残ってたんだ。……ねえ、今日は一緒に帰らない？", next: "invitation" },
  invitation: { speaker: "ラヴィア", text: "駅前に新しいクレープ屋さんができたんだって。きみと行けたら、うれしいな。", choices: [
    { text: "もちろん！ ラヴィアと行きたい。", next: "happy" },
    { text: "ふたりで？ ちょっと緊張するな。", next: "shy" }
  ] },
  happy: { speaker: "ラヴィア", text: "ほんと？ ……えへへ。そんなふうに言ってもらえると、誘ってよかった。", expression: "^ ‿ ^", next: "promise" },
  shy: { speaker: "ラヴィア", text: "……実は、わたしも。きみを誘うだけで、こんなにドキドキするなんて。", expression: "• ⌣ •", next: "promise" },
  promise: { speaker: "ラヴィア", text: "じゃあ、行こっか。……明日も、こうして一緒に帰れたらいいな。", choices: [
    { text: "明日も、その先も一緒に帰ろう。", next: "sweetEnd" },
    { text: "まずは今日を、思いっきり楽しもう！", next: "gentleEnd" }
  ] },
  sweetEnd: { speaker: "ラヴィア", text: "約束だよ？ ……きみとの明日が、今から楽しみ。♡", expression: "^ ‿ ^", next: "sweetEpilogue" },
  gentleEnd: { speaker: "ラヴィア", text: "うん！ 今日は、ふたりのクレープ記念日だね。……なんて。えへへ。", expression: "^ ‿ ^", next: "gentleEpilogue" },
  sweetEpilogue: { speaker: "ENDING 01 / 明日も、きみと", text: "夕焼けの帰り道。少しだけ近づいたふたりの距離。このドキドキは、きっと恋のはじまり。", end: true },
  gentleEpilogue: { speaker: "ENDING 02 / 甘い寄り道", text: "並んで歩く、いつもとは違う帰り道。甘い香りと笑顔に包まれて、ふたりの物語は続いていく。", end: true }
};

let step = 0;
function showScene(id) {
  const scene = story[id];
  step += 1;
  speaker.textContent = scene.speaker;
  text.textContent = scene.text;
  document.getElementById("progress").textContent = scene.end ? "FIN ♡" : `SCENE ${String(step).padStart(2, "0")}`;
  choices.replaceChildren();
  nextButton.hidden = !scene.next;
  restartButton.hidden = !scene.end;
  nextButton.onclick = scene.next ? () => showScene(scene.next) : null;
  for (const choice of scene.choices || []) {
    const button = document.createElement("button");
    button.textContent = choice.text;
    button.addEventListener("click", () => showScene(choice.next));
    choices.append(button);
  }
  const target = choices.firstElementChild || (scene.end ? restartButton : nextButton);
  target.focus({ preventScroll: true });
}

function startGame() {
  step = 0;
  titleScreen.hidden = true;
  gameScreen.hidden = false;
  showScene("opening");
}
document.getElementById("start-button").addEventListener("click", startGame);
restartButton.addEventListener("click", startGame);
document.getElementById("title-button").addEventListener("click", () => {
  gameScreen.hidden = true;
  titleScreen.hidden = false;
  document.getElementById("start-button").focus({ preventScroll: true });
});

});
</script>

<body>
  <header class="topbar"><a href="./" aria-label="タイトルへ">LAVIA <span>♡</span></a><span>放課後、きみとふたり。</span><span class="edition">恋愛アドベンチャー / PROTOTYPE</span></header>
  <main>
    <section id="title-screen" class="title-screen" aria-labelledby="game-title">
      <div class="intro">
        <p class="eyebrow">A LITTLE MOMENT, A LITTLE LOVE</p>
        <p class="chapter">放課後の、小さな恋のはじまり。</p>
        <h1 id="game-title">ラヴィアと<br><span>ドキドキしよ<em>♡</em></span></h1>
        <p class="description">いつもと同じ帰り道。だけど今日は、少しだけ特別。<br>あなたの言葉で、ふたりの距離が近づいていく。</p>
        <button id="start-button" class="primary">はじめから遊ぶ <span>→</span></button>
        <p class="play-note">約3分で遊べる、小さな物語</p>
      </div>
      <div class="portrait title-portrait" aria-label="ラヴィアの立ち絵">
        <img class="character-image" src="./lavia_normal.jpg.jpg" alt="ラヴィアの全身立ち絵" width="1024" height="1536">
        <div class="portrait-label"><span>ヒロイン / LAVIA</span><strong>ラヴィア</strong><small>「ねえ、一緒に帰らない？」</small></div>
      </div>
      <div class="title-bottom"><span>01 — 放課後の約束</span><span>ひとつの選択が、恋のきっかけに。 ♡</span></div>
    </section>
    <section id="game-screen" class="game-screen" hidden aria-label="会話シーン">
      <div class="scene-top"><span>CHAPTER 01 <b>放課後の約束</b></span><button id="title-button" class="subtle">タイトルへ</button></div>
      <div class="scene-caption">AFTER SCHOOL <span> / </span> 夕暮れの教室</div>
      <div class="portrait scene-portrait" aria-label="ラヴィアの立ち絵"><img class="character-image" src="./lavia_normal.jpg.jpg" alt="ラヴィアの全身立ち絵" width="1024" height="1536"></div>
      <div class="dialogue-area"><div id="choices" class="choices" aria-label="返事を選ぶ"></div><div class="dialogue"><div class="dialogue-heading"><strong id="speaker">ラヴィア</strong><span id="progress"></span></div><p id="dialogue-text" aria-live="polite"></p><button id="next-button" class="next">次へ <span>▸</span></button><button id="restart-button" class="primary" hidden>もう一度遊ぶ ↻</button></div></div>
    </section>
  </main>
  <footer><span>ラヴィアとドキドキしよ♡</span><span>試作版 · 音声なし</span></footer>
</body>
